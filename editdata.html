<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แก้ไขข้อมูล</title>
</head>
<body bgcolor="#F4B183">

  <table width="100%" height="100%" bgcolor="#F4B183">
    <tr>
      <td align="center">

        <!-- แถบหัวข้อ -->
        <table width="500" bgcolor="#8B5A2B" cellpadding="14">
          <tr>
            <td width="50" align="left"><a href="main.html"><font color="#FFFFFF">←</font></a></td>
            <td align="center"><b><font color="#FFFFFF" size="5">แก้ไขข้อมูล</font></b></td>
            <td width="50"></td>
          </tr>
        </table>

        <br>

        <!-- ฟอร์มแก้ไขข้อมูล -->
        <form>
          <table width="500" bgcolor="#FDF3E7" cellpadding="14" border="1">

            <tr>
              <td width="150"><font color="#C0622B"><label>สายพันธุ์</label></font></td>
              <td>
                <select>
                  <option>ชิวาวา</option>
                  <option selected>ตุ๊กตา</option>
                  <option>ปั๊ก</option>
                  <option>เฟรนช์บูลด็อก</option>
                  <option>แจ็ค รัสเซลล์ เทอร์เรีย</option>
                </select>
              </td>
            </tr>

            <tr>
              <td><font color="#C0622B"><label>น้ำหนัก</label></font></td>
              <td>
                <select>
                  <option selected>4</option>
                  <option>5</option>
                  <option>6</option>
                  <option>7</option>
                </select>
                กิโลกรัม
              </td>
            </tr>

            <tr>
              <td><font color="#C0622B"><label>อาหาร</label></font></td>
              <td>
                <input type="text" size="10" value="345">
                กรัมต่อวัน
              </td>
            </tr>

          </table>

          <br>

          <!-- ปุ่มบันทึก -->
          <a href="main.html"><button type="button" style="background-color: #8B5A2B; color: #FFFFFF; border: none; border-radius: 25px; padding: 12px 48px; font-size: 16px; font-weight: bold; cursor: pointer;">บันทึก</button></a>
        </form>

        <br>

        <!-- เมนูนำทางด้านล่าง -->
        <table width="500" bgcolor="#FFFFFF" cellpadding="12" cellspacing="0" border="1">
          <tr>
            <td align="center" width="25%"><a href="#"><b><font color="#E67E22">หน้าหลัก</font></b></a></td>
            <td align="center" width="25%"><a href="#"><font color="#777777">จ่ายอาหาร</font></a></td>
            <td align="center" width="25%"><a href="#"><font color="#777777">ตรวจสอบอาหาร</font></a></td>
            <td align="center" width="25%"><a href="#"><font color="#777777">กล้อง</font></a></td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
